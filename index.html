<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minisistema de Simulacro Matemático ICFES</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App y Realtime Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-400">Simulacro Matemático ICFES</h1>
            <p class="text-slate-400 text-sm mt-1">Evaluación interactiva - Conectado a Firebase</p>
        </header>

        <!-- Contenedor del Simulacro -->
        <div id="quiz-container" class="space-y-6">
            <!-- Datos del estudiante -->
            <div id="user-info-section" class="space-y-3">
                <label class="block text-sm font-medium text-slate-300">Ingresa tu nombre completo:</label>
                <input type="text" id="student-name" placeholder="Ej. Sebastián García" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white">
                <button onclick="startQuiz()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl transition shadow-lg">Comenzar Simulacro</button>
            </div>

            <!-- Preguntas (Ocultas hasta iniciar) -->
            <div id="question-section" class="hidden space-y-4">
                <div class="flex justify-between text-xs text-slate-400 font-semibold uppercase tracking-wider">
                    <span id="question-progress">Pregunta 1 de 3</span>
                    <span id="student-display-name"></span>
                </div>

                <div class="p-4 bg-slate-800/60 rounded-xl border border-slate-700">
                    <p id="question-text" class="font-medium text-base mb-4 text-slate-200"></p>
                    <div id="options-container" class="space-y-2">
                        <!-- Las opciones se inyectarán aquí -->
                    </div>
                </div>

                <button id="next-btn" onclick="nextQuestion()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl transition shadow-lg hidden">Siguiente Pregunta</button>
            </div>

            <!-- Pantalla Final -->
            <div id="results-section" class="hidden text-center space-y-4 py-6">
                <div class="text-emerald-400 text-5xl font-bold">🎉</div>
                <h2 class="text-xl font-bold">¡Simulacro Finalizado!</h2>
                <p class="text-slate-300 text-sm">Tus respuestas han sido enviadas y registradas con éxito en la base de datos de Firebase.</p>
                <div class="p-4 bg-slate-800 rounded-xl border border-slate-700 inline-block">
                    <p class="text-indigo-300 font-semibold text-lg" id="final-score-text"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuración de Firebase (Vinculada a tu proyecto)
        const firebaseConfig = {
            databaseURL: "https://crispy-giggle-default-rtdb.firebaseio.com/" // Ajusta o usa tu URL de Firebase validada
        };
        
        // Inicializar Firebase de forma segura
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Preguntas del simulacro matemático ICFES
        const questions = [
            {
                question: "¿Cuál es el resultado de resolver una función lineal con pendiente positiva ($m > 0$)?",
                options: [
                    "A) La recta asciende de izquierda a derecha",
                    "B) La recta es completamente horizontal",
                    "C) La recta desciende de izquierda a derecha",
                    "D) La recta es una parábola cóncava"
                ],
                correct: 0
            },
            {
                question: "Si en un triángulo rectángulo los catetos miden 3 cm y 4 cm, ¿cuánto mide la hipotenusa?",
                options: [
                    "A) 7 cm",
                    "B) 5 cm",
                    "C) 25 cm",
                    "D) 6 cm"
                ],
                correct: 1
            },
            {
                question: "¿Cuál es el valor de la probabilidad de que al lanzar un dado legal de 6 caras salga un número primo?",
                options: [
                    "A) 1/6",
                    "B) 1/2",
                    "C) 2/3",
                    "D) 1/3"
                ],
                correct: 1 // Los primos en un dado son 2, 3, 5 (3 de 6 = 1/2)
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let studentName = "";
        let userAnswers = [];

        function startQuiz() {
            const nameInput = document.getElementById("student-name").value.trim();
            if (!nameInput) {
                alert("Por favor, ingresa tu nombre antes de comenzar.");
                return;
            }
            studentName = nameInput;
            document.getElementById("user-info-section").classList.add("hidden");
            document.getElementById("question-section").classList.remove("hidden");
            document.getElementById("student-display-name").innerText = `Estudiante: ${studentName}`;
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById("question-progress").innerText = `Pregunta ${currentQuestionIndex + 1} de ${questions.length}`;
            document.getElementById("question-text").innerText = q.question;
            
            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            q.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-3 rounded-lg bg-slate-800 hover:bg-indigo-600/30 border border-slate-700 transition text-sm text-slate-200";
                btn.innerText = opt;
                btn.onclick = () => selectOption(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById("next-btn").classList.add("hidden");
        }

        function selectOption(selectedIndex) {
            const q = questions[currentQuestionIndex];
            userAnswers.push({ question: q.question, selected: selectedIndex, correct: q.correct });

            if (selectedIndex === q.correct) {
                score++;
            }

            // Deshabilitar botones para evitar doble clic
            const buttons = document.getElementById("options-container").children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (i === q.correct) {
                    buttons[i].classList.add("bg-emerald-600/40", "border-emerald-500");
                } else if (i === selectedIndex) {
                    buttons[i].classList.add("bg-rose-600/40", "border-rose-500");
                }
            }

            document.getElementById("next-btn").classList.remove("hidden");
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            document.getElementById("question-section").classList.add("hidden");
            document.getElementById("results-section").classList.remove("hidden");
            document.getElementById("final-score-text").innerText = `Puntuación: ${score} de ${questions.length}`;

            // Enviar resultados a Firebase Realtime Database
            const resultData = {
                studentName: studentName,
                score: score,
                total: questions.length,
                answers: userAnswers,
                timestamp: new Date().toISOString()
            };

            db.ref("resultados_simulacro").push(resultData)
                .then(() => {
                    console.log("Datos guardados exitosamente en Firebase.");
                })
                .catch((error) => {
                    console.error("Error al guardar en Firebase:", error);
                });
        }
    </script>
</body>
</html>
